<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How Starlink Works — An Interactive Field Guide</title>
    <meta
      name="description"
      content="How does Starlink actually work? An interactive guide to the satellite constellation: low Earth orbit, phased-array terminals, spot beams, gateways, laser links and the physics of latency."
    />
    <meta name="theme-color" content="#04060d" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1120'/><circle cx='50' cy='50' r='13' fill='%233ddbd9'/><ellipse cx='50' cy='50' rx='38' ry='17' fill='none' stroke='%239fe8ff' stroke-width='3.5' transform='rotate(-24 50 50)'/><circle cx='79' cy='35' r='5' fill='%23fbbf24'/></svg>"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="How Starlink Works — An Interactive Field Guide" />
    <meta
      property="og:description"
      content="From the phased array on your roof to the laser mesh in orbit: how a low-Earth-orbit broadband constellation actually works, with an interactive 3D model."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Fonts load off the critical path. A stylesheet in <head> blocks every
      paint until it arrives, so on a slow network (or a network where Google
      Fonts is slow or blocked) the whole page used to sit on a black screen.
      The preload is promoted to a stylesheet once it is downloaded; the system
      stack carries the page until then.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>

    <!--
      The Earth day/night maps are deliberately NOT preloaded here. They are
      only needed by the lazy 3D chunk, and preloading them competed with the
      entry bundle on pages that never show a globe.
    -->

    <!--
      Boot screen. Inline on purpose: it has to paint before the CSS bundle and
      before React, so the tab never shows a blank page while the entry chunk
      downloads. React replaces it on first render.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        background: #04060d;
        color: #e9effc;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      #boot svg {
        width: 62px;
        height: 62px;
        overflow: visible;
      }
      #boot .boot-ring {
        transform-origin: 31px 31px;
        animation: boot-spin 7s linear infinite;
      }
      #boot-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      #boot-hint {
        margin: 0;
        max-width: 22rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        line-height: 1.7;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8b9bb9;
      }
      #boot-bar {
        width: 132px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
      }
      #boot-error {
        max-width: 28rem;
        margin: 0;
        font-size: 12px;
        line-height: 1.65;
        color: #fbbf24;
      }
      #boot-retry {
        display: none;
        padding: 8px 16px;
        border: 1px solid rgba(61, 219, 217, 0.45);
        border-radius: 999px;
        background: rgba(61, 219, 217, 0.12);
        color: #7ee7e2;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #boot-retry:hover {
        background: rgba(61, 219, 217, 0.22);
        color: #fff;
      }
      #boot-bar i {
        display: block;
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, rgba(61, 219, 217, 0), #3ddbd9, rgba(61, 219, 217, 0));
        animation: boot-sweep 1.3s ease-in-out infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-sweep {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(330%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-ring,
        #boot-bar i {
          animation: none;
        }
      }
      noscript .boot-noscript {
        display: block;
        margin-top: 10px;
        font-size: 11.5px;
        line-height: 1.6;
        letter-spacing: 0;
        text-transform: none;
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <svg viewBox="0 0 62 62" fill="none" aria-hidden="true">
          <circle cx="31" cy="31" r="13" stroke="#3ddbd9" stroke-opacity="0.75" stroke-width="1.4" />
          <g class="boot-ring">
            <ellipse
              cx="31"
              cy="31"
              rx="26"
              ry="10"
              stroke="#9fe8ff"
              stroke-opacity="0.45"
              stroke-width="1.1"
              transform="rotate(-24 31 31)"
            />
            <circle cx="54" cy="20" r="3.4" fill="#fbbf24" />
          </g>
        </svg>
        <p id="boot-title">How Starlink Works</p>
        <div id="boot-bar"><i></i></div>
        <p id="boot-hint">Loading the interactive field guide…</p>
        <p id="boot-error" hidden></p>
        <button id="boot-retry" type="button">Reload the guide</button>
        <noscript>
          <span class="boot-noscript">
            This guide is interactive and needs JavaScript. The 3D model also needs WebGL.
          </span>
        </noscript>
      </div>
    </div>

    <script>
      /*
        Boot watchdog. The app replaces this screen on its first commit; until
        then, a visitor should never be left with an unexplained spinner. If
        the bundle throws, fails to arrive, or the browser cannot start it, say
        what happened and offer a single, explicit retry instead of leaving
        people to reload blindly.
      */
      (function () {
        var hint = document.getElementById("boot-hint");
        var error = document.getElementById("boot-error");
        var retry = document.getElementById("boot-retry");

        function booted() {
          return !document.getElementById("boot");
        }

        function fail(message) {
          if (booted()) return;
          if (hint) hint.textContent = "The guide could not start.";
          if (error) {
            error.hidden = false;
            error.textContent = message;
          }
          if (retry) retry.style.display = "inline-block";
        }

        if (retry) {
          retry.addEventListener("click", function () {
            window.location.reload();
          });
        }

        // Runtime errors from the app's own scripts. Resource errors (a font or
        // an image that 404s) must not fail the whole boot.
        window.addEventListener("error", function (event) {
          if (event && event.target && event.target !== window) return;
          var detail = event && event.message ? event.message : "A script failed to load.";
          fail(detail + " Reloading is usually enough; if it is not, the browser may be blocking scripts.");
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          var detail = reason && reason.message ? reason.message : String(reason || "Unknown error");
          fail("A module failed to start: " + detail);
        });

        window.setTimeout(function () {
          if (booted() || !hint) return;
          if (retry && retry.style.display === "inline-block") return;
          hint.textContent =
            "Still loading — the page has to download its scripts. A slow or filtered connection can take a minute.";
        }, 12000);

        window.setTimeout(function () {
          if (booted()) return;
          fail(
            "The app did not start. It may be a slow connection, a blocked script, or an old browser. " +
              "The guide needs JavaScript and a browser from the last few years.",
          );
        }, 30000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
